name: Backend Pull Request

on:
  pull_request:
    branches: [ 'master' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend*'
      - '!backend/README.md'

jobs:
  backend-ci:
    uses: oxctl/shared-workflows/.github/workflows/backend_ci.yml@master
    with:
      timeout_minutes: 10
name: Frontend and Backend build
run-name: "Deploy ${{ github.ref }}"
# Trigger-only change to force a fresh push run after CI workflow updates.

on:
  push:
    branches: [ 'master', 'release', 'dr-*' ]
    tags: [ '*' ]
    paths:
      - 'aws/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend*'
      - '.github/workflows/backend*'
      - 'tool-config/**'
      - '!**/README.md'
  workflow_dispatch:
  repository_dispatch:
    types: [sns_event]

jobs:
  deploy:
    uses: oxctl/shared-workflows/.github/workflows/deploy.yml@v2
    permissions:
      id-token: write
      contents: read
    with:
      env_type: ${{ startsWith(github.ref_name, 'dr-') && 'dr' || github.ref_name }}
    secrets: inherit
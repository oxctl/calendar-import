name: PR for release
# Limit it to just creating the PR.
permissions: 
  contents:  read
  pull-requests: write
on:
  workflow_dispatch: 
      
jobs:
  create-pr:
    uses: oxctl/shared-workflows/.github/workflows/release.yml@master
    with:
      base_branch: release
      head_branch: master
      label: release
      title: Release Request
      body: Created by Github action
      draft: false